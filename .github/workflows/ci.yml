# Publishing is manual for now: upstream's publish workflow used crates.io
# trusted publishing configured for the tsp-ltv crate, which ritsp-ltv has not
# set up yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  test:
    name: RustCrypto (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [default, document-only, tsp-only]
        include:
          - profile: default
            features: tsp,ltv,blocking,rustcrypto,tls-ring,legacy-algorithms
          - profile: document-only
            features: rustcrypto,legacy-algorithms
          - profile: tsp-only
            features: tsp,blocking,rustcrypto,tls-ring,legacy-algorithms
    env:
      LTV_TEST_FEATURES: ${{ matrix.features }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Resolve pinned sibling review commits
        shell: bash
        run: python .github/scripts/setup-coordinated-stack.py
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build selected profile
        run: cargo build --locked --no-default-features --features "$LTV_TEST_FEATURES"
      - name: Clippy selected profile
        run: cargo clippy --locked --all-targets --no-default-features --features "$LTV_TEST_FEATURES" -- -D warnings
      - name: Run all unit, integration and documentation tests
        run: cargo test --locked --no-default-features --features "$LTV_TEST_FEATURES"
      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features --features "$LTV_TEST_FEATURES"

  provider-matrix:
    name: Document / TLS (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aws-lc-aws-lc
            features: tsp,ltv,blocking,aws-lc,tls-aws-lc,legacy-algorithms
          - profile: rustcrypto-aws-lc
            features: tsp,ltv,blocking,rustcrypto,tls-aws-lc,legacy-algorithms
          - profile: aws-lc-ring
            features: tsp,ltv,blocking,aws-lc,tls-ring,legacy-algorithms
          - profile: aws-lc-document-only
            features: aws-lc,legacy-algorithms
    env:
      LTV_TEST_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Install AWS-LC native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Resolve pinned sibling review commits
        shell: bash
        run: python .github/scripts/setup-coordinated-stack.py
      - name: Build selected providers
        run: cargo build --locked --no-default-features --features "$LTV_TEST_FEATURES"
      - name: Clippy selected providers
        run: cargo clippy --locked --all-targets --no-default-features --features "$LTV_TEST_FEATURES" -- -D warnings
      - name: Run all provider unit, integration and documentation tests
        run: cargo test --locked --no-default-features --features "$LTV_TEST_FEATURES"
      - name: Build provider documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --no-default-features --features "$LTV_TEST_FEATURES"
      - name: AWS-LC document provider excludes RustCrypto primitives
        if: startsWith(matrix.profile, 'aws-lc-')
        run: |
          tree_file="$RUNNER_TEMP/ritsp-ltv-aws-tree.txt"
          cargo tree --locked --no-default-features --features "$LTV_TEST_FEATURES" -e normal --prefix none > "$tree_file"
          forbidden='^(rsa|dsa|ecdsa|p256|p384|p521|ed25519-dalek|x25519-dalek|aes|aes-gcm|cbc|des|sha1|sha2|sha3|hmac|ml-dsa|slh-dsa|ml-kem) v'
          if rg "$forbidden" "$tree_file"; then
            echo "::error::AWS-LC document provider includes a RustCrypto primitive implementation"
            exit 1
          fi

  feature-check:
    name: Invalid feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Resolve pinned sibling review commits
        shell: bash
        run: python .github/scripts/setup-coordinated-stack.py
      - name: Invalid combinations fail
        run: |
          if cargo check --locked --no-default-features; then
            echo "missing document provider unexpectedly compiled" >&2
            exit 1
          fi
          if cargo check --locked --no-default-features --features rustcrypto,aws-lc; then
            echo "multiple document providers unexpectedly compiled" >&2
            exit 1
          fi
          if cargo check --locked --no-default-features --features tsp,rustcrypto; then
            echo "networking without TLS provider unexpectedly compiled" >&2
            exit 1
          fi

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.88.0
        with:
          toolchain: 1.88.0
      - name: Resolve pinned sibling review commits
        shell: bash
        run: python .github/scripts/setup-coordinated-stack.py
      - run: cargo check --locked

  fips:
    name: FIPS (AWS-LC, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install AWS-LC native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Resolve pinned sibling review commits
        shell: bash
        run: python .github/scripts/setup-coordinated-stack.py
      - name: Verify FIPS initialization policy
        run: cargo test --locked --no-default-features --features tsp,ltv,blocking,legacy-algorithms,fips,tls-aws-lc --test fips_initialization
      - name: Attest digest and HTTPS provider use
        run: cargo test --locked --no-default-features --features tsp,ltv,blocking,legacy-algorithms,fips,tls-aws-lc --test fips_attestation
      - name: Invalid FIPS provider combinations fail closed
        run: |
          if cargo check --locked --no-default-features --features rustcrypto,fips; then
            echo "::error::FIPS unexpectedly compiled with RustCrypto document crypto"
            exit 1
          fi
          if cargo check --locked --no-default-features --features tsp,fips,tls-ring; then
            echo "::error::FIPS networking unexpectedly compiled with ring TLS"
            exit 1
          fi

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, provider-matrix, feature-check, msrv, fips]
    if: always()
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
